databaseChangeLog:
  - changeSet:
      id: 002-seed-limit-data
      context: demo
      changes:
        - insert:
            tableName: users
            columns:
              - column: {name: external_id, value: "u-001"}
              - column: {name: display_name, value: "Ivan"}
        - insert:
            tableName: users
            columns:
              - column: {name: external_id, value: "u-002"}
              - column: {name: display_name, value: "Maria"}
        - insert:
            tableName: users
            columns:
              - column: {name: external_id, value: "u-003"}
              - column: {name: display_name, value: "John Doe"}

        - insert:
            tableName: user_limits
            columns:
              - column: {name: user_id, valueComputed: "(SELECT id FROM users WHERE external_id = 'u-001')"}
              - column: {name: available_limit, valueNumeric: 85000.00}
              - column: {name: reserved_amount, valueNumeric: 15000.00}
        - insert:
            tableName: user_limits
            columns:
              - column: {name: user_id, valueComputed: "(SELECT id FROM users WHERE external_id = 'u-002')"}
              - column: {name: available_limit, valueNumeric: 80000.00}
              - column: {name: reserved_amount, valueNumeric: 0.00}
        - insert:
            tableName: user_limits
            columns:
              - column: {name: user_id, valueComputed: "(SELECT id FROM users WHERE external_id = 'u-003')"}
              - column: {name: available_limit, valueNumeric: 100000.00}
              - column: {name: reserved_amount, valueNumeric: 0.00}

        - insert:
            tableName: limit_reservations
            columns:
              - column: {name: user_id, valueComputed: "(SELECT id FROM users WHERE external_id = 'u-001')"}
              - column: {name: amount, valueNumeric: 15000.00}
              - column: {name: status, value: "RESERVED"}
        - insert:
            tableName: limit_reservations
            columns:
              - column: {name: user_id, valueComputed: "(SELECT id FROM users WHERE external_id = 'u-002')"}
              - column: {name: amount, valueNumeric: 20000.00}
              - column: {name: status, value: "CONFIRMED"}
        - insert:
            tableName: limit_reservations
            columns:
              - column: {name: user_id, valueComputed: "(SELECT id FROM users WHERE external_id = 'u-003')"}
              - column: {name: amount, valueNumeric: 5000.00}
              - column: {name: status, value: "RELEASED"}

        - insert:
            tableName: limit_operations
            columns:
              - column: {name: user_id, valueComputed: "(SELECT id FROM users WHERE external_id = 'u-001')"}
              - column: {name: operation_type, value: "RESET"}
              - column: {name: change_amount, valueNumeric: 100000.00}
        - insert:
            tableName: limit_operations
            columns:
              - column: {name: user_id, valueComputed: "(SELECT id FROM users WHERE external_id = 'u-001')"}
              - column: {name: reservation_id, valueComputed: "(SELECT id FROM limit_reservations WHERE status = 'RESERVED' AND user_id = (SELECT id FROM users WHERE external_id = 'u-001') LIMIT 1)"}
              - column: {name: operation_type, value: "RESERVE"}
              - column: {name: change_amount, valueNumeric: -15000.00}

        - insert:
            tableName: limit_operations
            columns:
              - column: {name: user_id, valueComputed: "(SELECT id FROM users WHERE external_id = 'u-002')"}
              - column: {name: operation_type, value: "RESET"}
              - column: {name: change_amount, valueNumeric: 100000.00}
        - insert:
            tableName: limit_operations
            columns:
              - column: {name: user_id, valueComputed: "(SELECT id FROM users WHERE external_id = 'u-002')"}
              - column: {name: reservation_id, valueComputed: "(SELECT id FROM limit_reservations WHERE status = 'CONFIRMED' AND user_id = (SELECT id FROM users WHERE external_id = 'u-002') LIMIT 1)"}
              - column: {name: operation_type, value: "RESERVE"}
              - column: {name: change_amount, valueNumeric: -20000.00}
        - insert:
            tableName: limit_operations
            columns:
              - column: {name: user_id, valueComputed: "(SELECT id FROM users WHERE external_id = 'u-002')"}
              - column: {name: reservation_id, valueComputed: "(SELECT id FROM limit_reservations WHERE status = 'CONFIRMED' AND user_id = (SELECT id FROM users WHERE external_id = 'u-002') LIMIT 1)"}
              - column: {name: operation_type, value: "DEBIT"}
              - column: {name: change_amount, valueNumeric: -20000.00}

        - insert:
            tableName: limit_operations
            columns:
              - column: {name: user_id, valueComputed: "(SELECT id FROM users WHERE external_id = 'u-003')"}
              - column: {name: operation_type, value: "RESET"}
              - column: {name: change_amount, valueNumeric: 100000.00}
        - insert:
            tableName: limit_operations
            columns:
              - column: {name: user_id, valueComputed: "(SELECT id FROM users WHERE external_id = 'u-003')"}
              - column: {name: reservation_id, valueComputed: "(SELECT id FROM limit_reservations WHERE status = 'RELEASED' AND user_id = (SELECT id FROM users WHERE external_id = 'u-003') LIMIT 1)"}
              - column: {name: operation_type, value: "RESERVE"}
              - column: {name: change_amount, valueNumeric: -5000.00}
        - insert:
            tableName: limit_operations
            columns:
              - column: {name: user_id, valueComputed: "(SELECT id FROM users WHERE external_id = 'u-003')"}
              - column: {name: reservation_id, valueComputed: "(SELECT id FROM limit_reservations WHERE status = 'RELEASED' AND user_id = (SELECT id FROM users WHERE external_id = 'u-003') LIMIT 1)"}
              - column: {name: operation_type, value: "RELEASE"}
              - column: {name: change_amount, valueNumeric: 5000.00}
